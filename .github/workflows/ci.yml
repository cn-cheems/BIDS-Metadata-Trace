name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.17+d971670cd
          core-version: 0.10.17+d971670cd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon version --all
      - run: moon update
      - name: Reject invalid acceptance controls and stale success evidence
        run: moon run scripts/check-acceptance-guards.mbtx
      - name: Build, test, reproduce workflows and verify archive adoption
        run: moon run scripts/acceptance.mbtx
      - name: Upload revision-bound acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: _build/acceptance.json
          if-no-files-found: error
